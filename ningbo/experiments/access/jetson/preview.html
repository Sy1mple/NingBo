<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宁波实验箱 · 摄像头预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#11181c;color:#e5eeee}
*{box-sizing:border-box}body{margin:0;padding:40px 28px}main{max-width:1120px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.eyebrow{font-size:12px;letter-spacing:2px;color:#8babab}h1{font-size:28px;font-weight:550;margin:9px 0 0}
.badge{display:flex;align-items:center;gap:9px;border:1px solid #3e5156;padding:9px 14px;border-radius:30px;font-size:14px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#dbac58}.badge.live .dot{background:#71dfb4}.badge.error .dot{background:#ff8585}
.stage{position:relative;background:#070c0f;border:1px solid #2e4248;border-radius:16px;min-height:300px;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center}
img{width:100%;height:100%;position:absolute;object-fit:contain}img[hidden]{display:none}
.empty{text-align:center;color:#b2c5c9;padding:30px}.icon{font-size:38px;color:#6f8f96;margin-bottom:18px}.empty p{font-size:15px;line-height:1.8;margin:8px 0}
.strip{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;color:#97b0b6;font-size:13px;flex-wrap:wrap}
.caption{color:#758f96;font-size:13px;border-top:1px solid #263a40;padding-top:20px;line-height:1.8}
.task{border:1px solid #344b51;border-radius:10px;padding:16px 18px;margin:2px 0 20px;background:#182329}.task[hidden]{display:none}
.task strong{font-size:15px}.task p{color:#b7ccd0;margin:8px 0 0;font-size:14px;line-height:1.6}.task.done{border-color:#3d8068}.task.failed{border-color:#9b5858}
button{background:transparent;border:1px solid #426069;color:#d5e9ee;border-radius:7px;padding:8px 12px;cursor:pointer}
@media(max-width:600px){body{padding:24px 16px}h1{font-size:21px}header{align-items:flex-start}.stage{min-height:220px}.badge{font-size:12px;padding:8px}}
</style>
<main>
<header><div><div class="eyebrow">NINGBO · CAMERA</div><h1>摄像头实时预览</h1></div><div id="badge" class="badge"><span class="dot"></span><span id="state">正在连接预览服务</span></div></header>
<section class="stage"><img id="video" alt="摄像头实时画面" hidden><div id="empty" class="empty"><div class="icon">◉</div><p id="note">正在连接预览服务…</p><p id="hint">画面就绪后将在这里自动显示。</p></div></section>
<div class="strip"><span id="source">等待摄像头连接</span><span id="resolution">—</span><button id="reconnect" type="button">重新连接画面</button></div>
<section id="task" class="task" hidden><strong id="taskTitle">等待门禁操作</strong><p id="taskNote"></p><p id="person"></p></section>
<p class="caption">开发板本地浏览器和远程电脑可以同时观看。预览只显示摄像头画面，不触发人脸比对或设备控制。</p>
</main>
<script>
const image=document.getElementById('video'), empty=document.getElementById('empty'), badge=document.getElementById('badge');
let streaming=false, streamFailed=false;
image.onerror=()=>{streamFailed=true;image.hidden=true;empty.hidden=false;document.getElementById('note').textContent='画面连接中断，正在重连…';};
image.onload=()=>{if(streaming){image.hidden=false;empty.hidden=true;}};
function clearVideo(){image.hidden=true;empty.hidden=false;image.removeAttribute('src');streaming=false;streamFailed=false;}
async function refresh(){
 try{
  const response=await fetch('/status',{cache:'no-store'});if(!response.ok)throw new Error();const s=await response.json();
  if(s.service!=='ningbo-camera-preview')throw new Error();
  const live=s.state==='streaming', bad=['error','stalled'].includes(s.state);
  badge.className='badge'+(live?' live':bad?' error':'');
  document.getElementById('state').textContent=live?'摄像头已连接':bad?'画面异常':s.state==='connecting'?'正在连接摄像头':'摄像头未采集';
  document.getElementById('note').textContent=s.note;
  document.getElementById('hint').textContent=bad?'请检查 USB 连接及终端提示。':'画面就绪后将在这里自动显示。';
  document.getElementById('source').textContent=s.device?'摄像头：'+s.device:'等待摄像头连接';
  document.getElementById('resolution').textContent=live?s.width+' × '+s.height+' · 实时画面':'—';
  const task=document.getElementById('task'),t=s.task;
  task.hidden=!t;
  if(t){
   const saved=t.phase==='completed'&&t.mode==='enroll'&&t.person;
   const verified=t.phase==='completed'&&t.mode==='recognize'&&typeof t.recognized==='boolean';
   task.className='task'+(saved||(verified&&t.recognized)?' done':t.error||(verified&&!t.recognized)?' failed':'');
   document.getElementById('taskTitle').textContent=saved?(t.person.duplicate?'该人员已在本地库中':'录入成功，已保存到本地库'):verified?(t.recognized?'身份验证成功':'身份验证失败'):t.error?'人脸任务失败':t.phase==='enrolling'?'正在录入人脸':t.phase==='recognizing'?'正在进行身份验证':t.phase==='starting'?'正在启动摄像头':t.phase==='stopping'?'正在停止':'等待门禁操作';
   document.getElementById('taskNote').textContent=t.error||t.note||'请在串口屏点击人脸录入或开始识别。';
   document.getElementById('person').textContent=t.person?'人员编号：'+t.person.person_id+'　姓名：'+t.person.name:'';
  }
  if(live){if(!streaming||streamFailed){streaming=true;streamFailed=false;image.src='/stream.mjpg?t='+Date.now();}}
  else clearVideo();
 }catch(e){clearVideo();badge.className='badge error';document.getElementById('state').textContent='预览服务连接断开';document.getElementById('note').textContent='无法连接预览服务，正在重试…';document.getElementById('hint').textContent='请确认预览程序和 SSH 连接仍在运行。';document.getElementById('resolution').textContent='—';}
 finally{setTimeout(refresh,1000);}
}
document.getElementById('reconnect').onclick=()=>{streamFailed=true;};
refresh();
</script>
</html>
